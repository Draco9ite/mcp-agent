<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DocuSign OAuth Successful</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#f7f9fc; color:#222; display:flex; align-items:center; justify-content:center; height:100vh; }
      .card { background:white; padding:24px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.08); max-width:720px; }
      h1 { margin:0 0 8px 0; font-size:20px; }
      p { margin:8px 0 0 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Authorization complete</h1>
      <p>{{ message or 'DocuSign OAuth completed successfully. You can close this window.' }}</p>
      <p style="margin-top:12px;color:#666;font-size:13px;">If you see this page but the application shows an error, check the server logs.</p>
    </div>
  </body>
</html>
